<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Birlik — til almashish</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper: #FAF6EE;
      --ink: #22304C;
      --stamp: #C1442E;
      --teal: #2F6F6E;
      --mustard: #D9A404;
      --line: #DFD6C0;
      --card: #FFFFFF;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #181611;
        --ink: #F2EDE1;
        --card: #221F19;
        --line: #39352A;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    h1,
    h2,
    h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      margin: 0;
    }

    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 20px 18px 24px;
    }

    .screen.active {
      display: flex;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--line);
    }

    .topbar h1 {
      font-size: 1.3rem;
    }

    .stamp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border: 2px solid var(--stamp);
      border-radius: 50%;
      color: var(--stamp);
      font-family: 'Fraunces', serif;
      font-size: 1.1rem;
      flex-shrink: 0;
      transform: rotate(-8deg);
    }

    label {
      font-size: .85rem;
      opacity: .75;
      display: block;
      margin: 16px 0 6px;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: .95rem;
    }

    input:focus,
    select:focus {
      outline: 2px solid var(--teal);
      outline-offset: 1px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .btn-primary {
      margin-top: 22px;
      background: var(--stamp);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
    }

    .btn-primary:active {
      opacity: .85;
    }

    .intro-hero {
      padding: 8px 0 18px;
    }

    .intro-hero p {
      opacity: .8;
      line-height: 1.5;
      margin-top: 8px;
      font-size: .95rem;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .partner-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: center;
      text-align: left;
      width: 100%;
    }

    .flag {
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .p-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .p-meta {
      font-size: .8rem;
      opacity: .65;
      margin-top: 2px;
    }

    .p-snippet {
      font-size: .85rem;
      opacity: .75;
      margin-top: 5px;
      line-height: 1.3;
    }

    .tab-bar {
      display: flex;
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .tab-bar button {
      flex: 1;
      background: none;
      border: none;
      padding: 11px 4px;
      font-size: .78rem;
      color: var(--ink);
      opacity: .55;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .tab-bar button.active {
      opacity: 1;
      color: var(--stamp);
      font-weight: 600;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--line);
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--ink);
      padding: 0 6px 0 0;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: .92rem;
      line-height: 1.4;
    }

    .msg.them {
      background: var(--card);
      border: 1px solid var(--line);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.me {
      background: var(--teal);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .phrase-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 0 14px 10px;
    }

    .phrase-chip {
      flex-shrink: 0;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: .8rem;
      white-space: nowrap;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
    }

    .chat-input-row input {
      flex: 1;
    }

    .send-btn {
      background: var(--stamp);
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.1rem;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty {
      opacity: .6;
      font-size: .9rem;
      text-align: center;
      margin-top: 40px;
      line-height: 1.5;
    }

    ::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- ONBOARDING -->
    <div class="screen active" id="screen-onboard">
      <div class="intro-hero">
        <span class="stamp">B</span>
        <h1 style="margin-top:12px;">Birlik</h1>
        <p>Dunyoning istalgan burchagidan odamlar bilan tanishing va bir-biringizga ona tilingizni o'rgating.</p>
      </div>
      <label for="in-name">Ismingiz</label>
      <input id="in-name" placeholder="Masalan: Dilnoza">
      <label for="in-native">Ona tilingiz</label>
      <select id="in-native">
        <option>O'zbekcha</option>
        <option>Ruscha</option>
        <option>Inglizcha</option>
        <option>Turkcha</option>
        <option>Koreyscha</option>
        <option>Ispancha</option>
      </select>
      <label for="in-learn">O'rganmoqchi bo'lgan tilingiz</label>
      <select id="in-learn">
        <option>Inglizcha</option>
        <option>Koreyscha</option>
        <option>Ispancha</option>
        <option>Turkcha</option>
        <option>Yaponcha</option>
        <option>Nemischa</option>
      </select>
      <button class="btn-primary" onclick="startApp()">Boshlash</button>
    </div>

    <!-- PARTNERS LIST -->
    <div class="screen" id="screen-list">
      <div class="topbar">
        <h1>Hamsuhbatlar</h1><span class="stamp" id="me-flag">🇺🇿</span>
      </div>
      <div class="screen" style="flex:1; padding:16px 18px; display:flex;" id="list-inner">
        <div class="card-list" id="partner-list"></div>
      </div>
      <div class="tab-bar">
        <button class="active">💬<span>Suhbatlar</span></button>
        <button onclick="alert('Bu demo ilovada mavjud emas.')">🔍<span>Qidirish</span></button>
        <button onclick="showProfile()">👤<span>Profil</span></button>
      </div>
    </div>

    <!-- CHAT -->
    <div class="screen" id="screen-chat">
      <div class="chat-header">
        <button class="back-btn" onclick="goToList()">←</button>
        <span class="flag" id="chat-flag">🌍</span>
        <div>
          <div class="p-name" id="chat-name">—</div>
          <div class="p-meta" id="chat-meta">—</div>
        </div>
      </div>
      <div class="chat-body" id="chat-body"></div>
      <div class="phrase-row" id="phrase-row"></div>
      <div class="chat-input-row">
        <input id="chat-input" placeholder="Xabar yozing..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="screen" id="screen-profile">
      <div class="topbar">
        <h1>Profilim</h1><button class="back-btn" onclick="goToList()">✕</button>
      </div>
      <div style="padding:20px 18px;">
        <label>Ism</label>
        <div id="prof-name" style="font-size:1.1rem;font-weight:600;"></div>
        <label>Ona tili</label>
        <div id="prof-native"></div>
        <label>O'rganayotgan til</label>
        <div id="prof-learn"></div>
        <button class="btn-primary" style="background:var(--ink);" onclick="resetProfile()">Profilni tozalash</button>
      </div>
    </div>

  </div>

  <script>
    const PARTNERS = [
      { id: 1, name: "Emily", flag: "🇬🇧", country: "Angliya", lang: "Inglizcha", greet: "Hi! I saw you're learning English 😊", phrases: ["Hello!", "How are you?", "What's your name?"], learnsUz: false },
      { id: 2, name: "Min-jun", flag: "🇰🇷", country: "Janubiy Koreya", lang: "Koreyscha", greet: "안녕하세요! Salom, tanishganimdan xursandman!", phrases: ["안녕하세요", "감사합니다", "제 이름은..."], learnsUz: true },
      { id: 3, name: "Carlos", flag: "🇪🇸", country: "Ispaniya", lang: "Ispancha", greet: "¡Hola! ¿Cómo estás hoy?", phrases: ["Hola", "¿Qué tal?", "Mucho gusto"], learnsUz: false },
      { id: 4, name: "Elif", flag: "🇹🇷", country: "Turkiya", lang: "Turkcha", greet: "Merhaba! Türkçe pratik yapmak ister misin?", phrases: ["Merhaba", "Nasılsın?", "Teşekkürler"], learnsUz: true },
      { id: 5, name: "Yuki", flag: "🇯🇵", country: "Yaponiya", lang: "Yaponcha", greet: "こんにちは！よろしくお願いします。", phrases: ["こんにちは", "ありがとう", "はじめまして"], learnsUz: false },
      { id: 6, name: "Anna", flag: "🇩🇪", country: "Germaniya", lang: "Nemischa", greet: "Hallo! Wollen wir uns gegenseitig helfen?", phrases: ["Hallo", "Wie geht's?", "Danke schön"], learnsUz: true },
    ];

    const REPLIES = {
      "Inglizcha": ["That's great, tell me more!", "Nice! How do you say that in your language?", "I'm learning too, this is fun 😄", "Can you correct my sentence?"],
      "Koreyscha": ["오 진짜요? 재미있네요!", "좋아요! 더 알려주세요.", "저도 한국어 배우고 있어요.", "맞아요, 잘하시네요!"],
      "Ispancha": ["¡Qué interesante! Cuéntame más.", "¡Genial! ¿Cómo se dice eso en tu idioma?", "Yo también estoy aprendiendo, ¡qué divertido!"],
      "Turkcha": ["Çok ilginç! Devam et.", "Harika! Bunu kendi dilinde nasıl söylüyorsun?", "Ben de öğreniyorum, çok eğlenceli!"],
      "Yaponcha": ["それは面白いですね！", "いいですね、もっと教えてください。", "私も勉強しています、楽しいです。"],
      "Nemischa": ["Das ist interessant! Erzähl mehr.", "Klasse! Wie sagt man das in deiner Sprache?", "Ich lerne auch, das macht Spaß!"]
    };

    let ME = null;
    let activePartner = null;

    function storageGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function init() {
      ME = storageGet('birlik_me');
      if (ME) {
        document.getElementById('in-name').value = ME.name;
        document.getElementById('in-native').value = ME.native;
        document.getElementById('in-learn').value = ME.learn;
        renderList();
        show('screen-list');
      }
    }

    function startApp() {
      const name = document.getElementById('in-name').value.trim() || "Do'st";
      const native = document.getElementById('in-native').value;
      const learn = document.getElementById('in-learn').value;
      ME = { name, native, learn };
      storageSet('birlik_me', ME);
      renderList();
      show('screen-list');
    }

    function renderList() {
      const wrap = document.getElementById('partner-list');
      wrap.innerHTML = '';
      const relevant = PARTNERS.filter(p => p.lang === ME.learn).concat(PARTNERS.filter(p => p.lang !== ME.learn));
      relevant.forEach(p => {
        const history = storageGet('birlik_chat_' + p.id) || [];
        const last = history.length ? history[history.length - 1].text : p.greet;
        const btn = document.createElement('button');
        btn.className = 'partner-card';
        btn.onclick = () => openChat(p.id);
        btn.innerHTML = `<span class="flag">${p.flag}</span>
      <div style="min-width:0;">
        <div class="p-name">${p.name}</div>
        <div class="p-meta">${p.country} · ${p.lang}${p.learnsUz ? " · O'zbekcha o'rganmoqda" : ""}</div>
        <div class="p-snippet">${last.length > 50 ? last.slice(0, 50) + '…' : last}</div>
      </div>`;
        wrap.appendChild(btn);
      });
    }

    function openChat(id) {
      activePartner = PARTNERS.find(p => p.id === id);
      document.getElementById('chat-flag').textContent = activePartner.flag;
      document.getElementById('chat-name').textContent = activePartner.name;
      document.getElementById('chat-meta').textContent = activePartner.country + " · " + activePartner.lang;

      let history = storageGet('birlik_chat_' + id);
      if (!history) { history = [{ from: 'them', text: activePartner.greet }]; storageSet('birlik_chat_' + id, history); }
      renderChat(history);

      const prow = document.getElementById('phrase-row');
      prow.innerHTML = '';
      activePartner.phrases.forEach(ph => {
        const c = document.createElement('button');
        c.className = 'phrase-chip'; c.textContent = ph;
        c.onclick = () => { document.getElementById('chat-input').value = ph; };
        prow.appendChild(c);
      });

      show('screen-chat');
    }

    function renderChat(history) {
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      history.forEach(m => {
        const d = document.createElement('div');
        d.className = 'msg ' + (m.from === 'me' ? 'me' : 'them');
        d.textContent = m.text;
        body.appendChild(d);
      });
      body.scrollTop = body.scrollHeight;
    }

    function sendMsg() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !activePartner) return;
      const key = 'birlik_chat_' + activePartner.id;
      let history = storageGet(key) || [];
      history.push({ from: 'me', text });
      storageSet(key, history);
      renderChat(history);
      input.value = '';

      setTimeout(() => {
        const pool = REPLIES[activePartner.lang] || ["😊"];
        const reply = pool[Math.floor(Math.random() * pool.length)];
        history = storageGet(key) || [];
        history.push({ from: 'them', text: reply });
        storageSet(key, history);
        renderChat(history);
      }, 900);
    }

    function goToList() { renderList(); show('screen-list'); }

    function showProfile() {
      document.getElementById('prof-name').textContent = ME.name;
      document.getElementById('prof-native').textContent = ME.native;
      document.getElementById('prof-learn').textContent = ME.learn;
      show('screen-profile');
    }

    function resetProfile() {
      localStorage.clear();
      ME = null;
      document.getElementById('in-name').value = '';
      show('screen-onboard');
    }

    init();
  </script>
</body>

</html>
