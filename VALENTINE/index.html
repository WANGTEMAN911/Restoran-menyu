<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="window">
        <div class="title-bar">
            <span>LOVE</span>
            <div class="window-controls">
                <span>_</span>
                <span>&#9633;</span>
                <span>X</span>
            </div>
        </div>

        <div class="hearts-bar">
            <span>&#9829;</span>
            <span>&#9829;</span>
            <span>&#9829;</span>
        </div>

        <div class="content-box">
            <h2 id="question">Will you be my Valentine?</h2>

            <img class="cat-img" id="cat"
                src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZydnAzeXh3cnF3Zm9xbWhuNDN3eTZndndreXo3ZW0wZXBzZTN3YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif"
                alt="Cat holding heart">

            <div class="buttons">
                <button class="btn" id="yes-btn" onclick="acceptInvitation()">YES</button>
                <button class="btn" id="no-btn" onmouseover="moveButton()">NO</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
